<section class="container criar-pensamentos ff-inter">
<header class="header">
  <h2>Adicione um<br>novo pensamento:</h2>
</header>
<form>
  <label for="pensamento">Pensamento:</label>
  <input
    type="textarea"
    name="pensamento"
    id="pensamento"
    class="input"
    placeholder="O que você está pensando?">
  <label for="autoria">Autoria:</label>
  <input
    type="text"
    name="autoria"
    id="autoria"
    class="input"
    placeholder="Quem é a autoria ou fonte do pensamento?">

    <label for="modelo">Selecione o layout do pensamento:</label>
    <div class="container-radio">
      <div class="radio-modelo">
        <label for="modelo1">
          <input
          type="radio"
          id="modelo1"
          value="modelo1"
          name="modelo-card">
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 1</span>
        </label>
        Prévia:
        <div class="modelo modelo1 ff-roboto-mono">
          <img src="../../../assets/Imagens/modelo1.png" alt="aspas azuis">
          <p class="conteudo">Aqui vai o conteúdo</p>
          <p class="conteudo">Aqui vai a autoria</p>
        </div>
      </div>



      <div class="radio-modelo">
        <label for="modelo2">
          <input
          type="radio"
          id="modelo2"
          value="modelo2"
          name="modelo-card">
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 2</span>
        </label>
        Prévia:
        <div class="modelo modelo2 ff-roboto-mono">
          <img src="../../../assets/Imagens/modelo2.png" alt="aspas azul claro">
          <p class="conteudo">Aqui vai o conteúdo</p>
          <p class="conteudo">Aqui vai a autoria</p>
        </div>
      </div>


      <div class="radio-modelo">
        <label for="modelo3">
          <input
          type="radio"
          id="modelo3"
          value="modelo3"
          name="modelo-card">
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 3</span>
        </label>
        Prévia:
        <div class="modelo modelo3 ff-roboto-mono">
          <img src="../../../assets/Imagens/modelo3.png" alt="aspas verdes">
          <p class="conteudo">Aqui vai o conteúdo</p>
          <p class="conteudo">Aqui vai a autoria</p>
        </div>
      </div>
    </div>
    <div class="acoes">
      <button class="botao">Salvar</button>
      <button class="botao">Cancelar</button>
    </div>
</form>
</section>
